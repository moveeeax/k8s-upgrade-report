apiVersion: batch/v1beta1
kind: CronJob
metadata:
  name: nightly-reindex
  namespace: shop
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: reindex
              image: registry.example.com/shop/reindex:1.4.2
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: storefront
  namespace: shop
spec:
  maxUnavailable: 0
  selector:
    matchLabels:
      app: storefront
---
apiVersion: policy/v1beta1
kind: PodDisruptionBudget
metadata:
  name: catch-all
  namespace: shop
spec:
  minAvailable: 1
  selector: {}
---
apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: storefront
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: storefront
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        targetAverageUtilization: 70
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  namespace: shop
spec:
  replicas: 3
  selector:
    matchLabels:
      app: storefront
  template:
    metadata:
      labels:
        app: storefront
    spec:
      nodeSelector:
        beta.kubernetes.io/os: linux
      containers:
        - name: storefront
          image: registry.example.com/shop/storefront:2.11.0
